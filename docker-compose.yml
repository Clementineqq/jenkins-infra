services:
  jenkins:
    build: .
    image: my-jenkins:lts
    container_name: jenkins

    ports:
      - "8081:8080"                   
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home                    # том из inspect

    restart: unless-stopped

volumes:
  jenkins_home:
    external: true
    name: jenkins_home
